name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    name: Lint, Test, & Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 22.x ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run test suite (Default UTC)
        run: npm test

      - name: Run test suite (Timezone America/Los_Angeles)
        run: TZ=America/Los_Angeles npm test

      - name: Typecheck
        run: npx tsc -b

      - name: Production build
        run: npm run build
